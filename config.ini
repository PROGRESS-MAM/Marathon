# Marathon 1.1.0 – Konfiguration (gehört nach res\config.ini)
# Alle Einträge sind Pflicht. Fehlt die Datei oder ist ein Eintrag fehlerhaft, meldet Marathon das und pausiert,
# bis die Datei korrigiert ist. Marathon liest die Datei alle paar Sekunden neu.
# Änderungen in [paths] und [fields] im laufenden Betrieb pausieren Marathon bis zum Neustart oder bis zur Rücknahme.
# Kommentare stehen in eigenen Zeilen, die mit # beginnen.

[paths]
# Netzlaufwerk; alle Ordnerangaben in pipelines.txt und in den Auftragslisten beziehen sich darauf
root_path = \\10.0.77.11\Ablage KI Proxy_1\Proxy 10 Mbit
# Arbeitsordner von Marathon in root_path und in jedem Zielordner (einfacher Ordnername)
work_dir = .marathon
# Zugang für ES-Search im res-Ordner
cred_file = cred.env
# Steps und Pipelines im res-Ordner
pipelines_file = pipelines.txt
# Ordner der Auftragslisten im res-Ordner; eine .txt-Datei je Auftragsliste
orders_dir = auftragslisten

[fields]
# Feldnamen in ES-Search, die Marathon je Clip abruft
clip_id = clip_id
identifier = 001 Identifier
title = 014 Title Original
clip_name = clip_name_with_extension
hash = hash
userpath = userpath
status_flags = status_flags
# Eintrag in status_flags, der einen Platzhalter kennzeichnet; Platzhalter werden übergangen
placeholder_flag = placeholder

[operation]
# true = keine Jobs und keine Schreibzugriffe auf das Netzlaufwerk (true/false)
report_only = true
# Uhrzeit des täglichen Auto-Berichts (HH:MM, Uhr dieses Rechners)
auto_report_time = 09:00
# Minuten Wartezeit nach einem fehlgeschlagenen Auto-Bericht (ab 1)
retry_minutes = 60

[timing]
# Sekunden zwischen zwei Job-Zyklen (ab 1)
cycle_seconds = 60
# Versuche je Job, danach dauerhaft fehlgeschlagen (ab 1)
max_job_attempts = 2
# Minuten ohne Größenänderung, bis Dateien in externen Ordnern als fertig kopiert gelten (0 = sofort)
stable_minutes = 2

[limits]
# Maximal offene Jobs je Modul über alle Pipelines und Steps (0 = Modul pausiert)
restore = 1
transcode = 8
qc = 8

[heartbeat]
# Minuten ohne Lebenszeichen, bis ein Worker als ausgefallen gilt (ab 1)
worker_timeout_minutes = 10
# Stunden, ab denen ein laufender Job im Bericht gemeldet wird (ab 1)
max_job_hours = 24
